<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>South Sound — 1850</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="terminal">
    <!-- Earned instrument strip: hidden until compass, tide notes, or current observation -->
    <div id="hud" class="hud hidden" aria-label="Instruments">
      <div id="hud-compass" class="hud-item hidden"></div>
      <div id="hud-tide" class="hud-item hidden"></div>
      <div id="hud-current" class="hud-item hidden"></div>
    </div>

    <div id="output" aria-live="polite"></div>

    <form id="feedback-ui" class="feedback-bar hidden">
      <input id="feedback-note" type="text" autocomplete="off" placeholder="Optional note (what you tried, bug, idea)...">
      <button type="submit" id="feedback-submit">Send</button>
      <button type="button" id="feedback-cancel">Cancel</button>
    </form>

    <div class="prompt-line">
      <span class="prompt-glyph" aria-hidden="true">&gt;</span>
      <input id="command" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" autofocus aria-label="Command input">
      <button type="button" id="send-log-btn" title="Send session transcript to Jonathan for debugging">send log</button>
    </div>
  </main>

  <script src="world_south.js"></script>
  <script src="world_central.js"></script>
  <script src="world_north.js"></script>
  <script src="world_hood.js"></script>
  <script src="world_strait.js"></script>
  <script src="world_canada.js"></script>
  <script src="world_alaska.js"></script>
  <script src="items.js"></script>
  <script src="hazards.js"></script>
  <script src="parser.js"></script>
  <script src="game.js"></script>
</body>
</html>
